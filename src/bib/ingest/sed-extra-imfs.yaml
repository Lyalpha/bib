  - release: "2.2.1"
    imf: imf_chab300
    pop_types: [bin, sin]
    metallicities: [zem5, zem4, z001, z002, z003, z004, z006, z008, z010, z014, z020, z030, z040]
    products: [spectra, colours, ionizing, starmass, supernova, yields, mlratio, numbers]
