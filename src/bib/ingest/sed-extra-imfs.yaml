# Additional BPASS v2.2.1 IMFs beyond the pedagogical 100 M☉ pair
# (imf135_100 and imf_chab100, loaded by sed-100.yaml).
#
# Point --source at a directory of official IMF tarballs. On the public VM
# that directory is ~/bpass_v2.2.1 (the 100 M☉ pair can sit in the same
# folder; this manifest does not open those archives).
#
#   bpass_v2.2.1_imf100_100.tar.gz
#   bpass_v2.2.1_imf100_300.tar.gz
#   bpass_v2.2.1_imf135_300.tar.gz
#   bpass_v2.2.1_imf170_100.tar.gz
#   bpass_v2.2.1_imf170_300.tar.gz
#   bpass_v2.2.1_imf_chab300.tar.gz
#
#   uv run bib ingest --source ~/bpass_v2.2.1 \
#                     --manifest src/bib/ingest/sed-extra-imfs.yaml
#
# One `bib ingest` commits only when the whole manifest succeeds. The VM
# driver next to the tarballs runs this file once per IMF for that reason.
# See docs/ingestion.md.

releases:
  "2.2.1":
    name: "Tuatara"
    url: "https://bpass.auckland.ac.nz"
    citation: >-
      Eldridge, Stanway et al. (2017), PASA 34, e058;
      Stanway & Eldridge (2018), MNRAS 479, 75.
    notes: >-
      v2.2.1 population products for the IMF variants that are not in the
      100 M☉ pedagogical load: broken power-laws with slopes 1.00, 1.35, and
      1.70 at 100 and 300 M☉ caps, plus Chabrier with a 300 M☉ cap.

populations:
  - release: "2.2.1"
    imf: imf100_100
    pop_types: [bin, sin]
    metallicities: [zem5, zem4, z001, z002, z003, z004, z006, z008, z010, z014, z020, z030, z040]
    products: [spectra, colours, ionizing, starmass, supernova, yields, mlratio, numbers]

  - release: "2.2.1"
    imf: imf100_300
    pop_types: [bin, sin]
    metallicities: [zem5, zem4, z001, z002, z003, z004, z006, z008, z010, z014, z020, z030, z040]
    products: [spectra, colours, ionizing, starmass, supernova, yields, mlratio, numbers]

  - release: "2.2.1"
    imf: imf135_300
    pop_types: [bin, sin]
    metallicities: [zem5, zem4, z001, z002, z003, z004, z006, z008, z010, z014, z020, z030, z040]
    products: [spectra, colours, ionizing, starmass, supernova, yields, mlratio, numbers]

  - release: "2.2.1"
    imf: imf170_100
    pop_types: [bin, sin]
    metallicities: [zem5, zem4, z001, z002, z003, z004, z006, z008, z010, z014, z020, z030, z040]
    products: [spectra, colours, ionizing, starmass, supernova, yields, mlratio, numbers]

  - release: "2.2.1"
    imf: imf170_300
    pop_types: [bin, sin]
    metallicities: [zem5, zem4, z001, z002, z003, z004, z006, z008, z010, z014, z020, z030, z040]
