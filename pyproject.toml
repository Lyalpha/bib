[project]
name = "bib"
version = "1.0.2"
description = "BPASS-in-Browser (bib): a pedagogical web explorer for BPASS stellar population synthesis results"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# TODO: fill the author before tagging; keep in sync with CITATION.cff and .zenodo.json.
authors = [{ name = "J. D. Lyman" }]
keywords = ["astronomy", "BPASS", "stellar populations", "spectral synthesis"]
dependencies = [
    "fastapi>=0.162.7",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "psycopg[binary]>=3.3.9",
    "alembic>=1.20.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "numpy>=2.5.4",
    "astropy>=8.0.2",
    "dust-extinction>=1.4",
    "typer>=0.29.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
bib = "bib.cli:main"

[project.optional-dependencies]
ops = ["sentry-sdk[fastapi]>=2.75.0"]
prod = ["gunicorn>=27.0.1"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=5.0",
    "ruff>=0.17.5",
    "mkdocs-material>=9.8.1",
    "mkdocstrings[python]>=1.0.8",
    "synphot>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bib"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Notebooks are narrative; they are executed, not linted.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; don't fight the generator.
"src/bib/db/migrations/versions/*" = ["W291", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "realdata: validation against the fetched BPASS v2.2.1 subset (needs data/raw/bpass-subset and PostgreSQL)",
]
filterwarnings = ["ignore::DeprecationWarning:pkg_resources"]
