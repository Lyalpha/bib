name: release

# On a version tag: validate the citation metadata, check the version is
# consistent everywhere, build and publish the container image, and create a
# GitHub release whose notes are the matching CHANGELOG.md section. Zenodo
# archives the release automatically once the repository is linked in the
# Zenodo GitHub integration (see docs/operations.md, "Releases and Zenodo").

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Citation metadata is valid
        run: uvx cffconvert --validate
      - name: Tag, pyproject, package, CITATION.cff and .zenodo.json agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          pkg=$(grep -oP '__version__ = "\K[^"]+' src/bib/__init__.py)
          cff=$(grep -oP '^version: \K.+' CITATION.cff)
          zen=$(python3 -c "import json;print(json.load(open('.zenodo.json'))['version'])")
          echo "tag=$tag pyproject=$py package=$pkg cff=$cff zenodo=$zen"
          for v in "$py" "$pkg" "$cff" "$zen"; do
            [ "$v" = "$tag" ] || { echo "version mismatch"; exit 1; }
          done
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$tag] section"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: No placeholders left in release metadata
        run: |
          if grep -nE "<(Family name|Given names|ORCID|affiliation|repository URL)>" \
               CITATION.cff .zenodo.json pyproject.toml LICENSE; then
            echo "fill the placeholders before tagging"; exit 1
          fi

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    runs-on: ubuntu-latest
    needs: [verify, image]
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's CHANGELOG section
        run: |
          v="${{ needs.verify.outputs.version }}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            CITATION.cff
            .zenodo.json
      - name: Zenodo archives this GitHub Release
        run: |
          {
            echo "## Zenodo"
            echo
            echo "Once [Lyalpha/bib is enabled](https://zenodo.org/account/settings/github/),"
            echo "Zenodo harvests this GitHub Release, reads \`.zenodo.json\`, and mints"
            echo "a version DOI plus a concept DOI. Do **not** also POST to the Zenodo"
            echo "API from CI — that would duplicate the deposit."
            echo
            echo "After the first archive, paste the concept DOI into \`CITATION.cff\`"
            echo "(\`identifiers:\`) and the README badge."
          } >> "$GITHUB_STEP_SUMMARY"
