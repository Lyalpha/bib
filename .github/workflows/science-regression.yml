name: science-regression

# Real-data validation: bib vs synphot and vs BPASS's own published tables on
# a fetched v2.2.1 subset (see tests/realdata/ and docs/science-notes.md).
# Weekly, on release tags, and on demand.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  BIB_SENTRY_DSN: ""

jobs:
  realdata:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bib
          POSTGRES_PASSWORD: bib
          POSTGRES_DB: bib_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bib"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Cache the BPASS subset and CALSPEC Vega
        uses: actions/cache@v4
        with:
          path: data/raw/bpass-subset
          key: bpass-subset-${{ hashFiles('scripts/fetch_bpass_subset.py') }}
      - name: Fetch the subset (hoki release branch + CALSPEC)
        run: uv run python scripts/fetch_bpass_subset.py
      - name: Real-data tests
        env:
          DATABASE_URL: postgresql+psycopg://bib:bib@localhost:5432/bib_test
        run: |
          uv run pytest -m realdata -rA --no-header -p no:cacheprovider \
            --junitxml=realdata.xml tests/realdata | tee realdata.log
      - name: Publish residual summary
        if: always()
        run: |
          {
            echo "## Real-data validation"
            echo
            echo "Reference residuals are tabulated in \`docs/science-notes.md\`."
            echo
            echo '```'
            grep -E "PASSED|FAILED|SKIPPED|ERROR" realdata.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realdata-results
          path: |
            realdata.xml
            realdata.log
