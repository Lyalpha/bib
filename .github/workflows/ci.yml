name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  BIB_SENTRY_DSN: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Citation metadata is valid
        run: uvx cffconvert --validate

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bib
          POSTGRES_PASSWORD: bib
          POSTGRES_DB: bib_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bib"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Tests (unit + DB; real-data tests skip without the fetched subset)
        env:
          DATABASE_URL: postgresql+psycopg://bib:bib@localhost:5432/bib_test
        run: uv run pytest -m "not realdata" --cov=bib --cov-report=term-missing

  docs:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Build documentation (strict)
        run: uv run mkdocs build --strict

  build-image:
    runs-on: ubuntu-latest
    needs: [test, docs]
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -f Containerfile -t bib:ci .
      - name: Image starts, migrates and answers the readiness probe
        run: |
          docker network create bib-ci
          docker run -d --name bib-ci-pg --network bib-ci \
            -e POSTGRES_USER=bib -e POSTGRES_PASSWORD=bib -e POSTGRES_DB=bib postgres:16-alpine
          docker run -d --name bib-ci --network bib-ci -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://bib:bib@bib-ci-pg:5432/bib \
            -e BIB_SENTRY_DSN= bib:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/ready; then exit 0; fi
            sleep 1
          done
          docker logs bib-ci
          exit 1
