name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bib
          POSTGRES_PASSWORD: bib
          POSTGRES_DB: bib_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bib"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        env:
          DATABASE_URL: postgresql+psycopg://bib:bib@localhost:5432/bib_test
        run: uv run pytest

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -f Containerfile -t bib:ci .
